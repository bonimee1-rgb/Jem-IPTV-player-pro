
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0c0e12">
  <meta name="description" content="Jem IPTV Player Pro - Premium IPTV Player">

  <title>Jem IPTV Player Pro</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./assets/icon.svg">
  <link rel="stylesheet" href="./styles.css">

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    /* Player fullscreen button overlay */

    .player-section {
      position: relative;
    }

    .player-toolbar {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 5;
    }

    .fullscreen-top-btn {
      background: rgba(255, 121, 0, 0.95);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 15px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 12px #0008;
    }

    .fullscreen-top-btn:active {
      transform: scale(0.95);
    }

    .player-section:fullscreen {
      width: 100vw;
      height: 100vh;
      margin: 0;
      border: none;
      border-radius: 0;
      background: #000;
    }

    .player-section:fullscreen #videoPlayer {
      width: 100%;
      height: 100%;
      max-height: none;
      aspect-ratio: auto;
      object-fit: contain;
    }

    #videoPlayer:fullscreen {
      width: 100vw;
      height: 100vh;
      background: #000;
      object-fit: contain;
    }

    .modal:not(.show) {
      display: none;
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header class="topbar">
    <div class="logo">
      JEM <span>IPTV PRO</span>
    </div>

    <button class="primary-btn" id="addPlaylistBtn" type="button">
      + Add Playlist
    </button>
  </header>

  <!-- APP LAYOUT -->

  <div class="app-layout">

    <!-- SIDEBAR -->

    <aside class="sidebar">
      <button class="active" data-filter="all" type="button">
        ⌂ All Channels
      </button>

      <button data-filter="favorites" type="button">
        ★ Favorites
      </button>
    </aside>

    <!-- MAIN CONTENT -->

    <main class="main-content">

      <h2>Live TV</h2>

      <p style="color:#9297ae; margin:8px 0 18px;">
        Welcome to Jem IPTV Player Pro
      </p>

      <!-- VIDEO PLAYER -->

      <section class="player-section">

        <!-- FULLSCREEN BUTTON ON TOP -->

        <div class="player-toolbar">
          <button
            type="button"
            id="fullscreenBtn"
            class="fullscreen-top-btn">
            ⛶ FULL SCREEN
          </button>
        </div>

        <video
          id="videoPlayer"
          controls
          playsinline
          webkit-playsinline
          preload="none"
          poster="./assets/player-poster.svg">
        </video>

        <div class="player-info">
          <strong id="nowPlaying">
            Select a channel to start watching
          </strong>
        </div>

      </section>

      <!-- SEARCH -->

      <div class="controls">

        <input
          type="search"
          id="searchInput"
          class="search-box"
          placeholder="Search channels..."
          autocomplete="off">

      </div>

      <!-- CHANNELS -->

      <h3 style="margin-bottom:15px;">
        Channels
      </h3>

      <div id="channelGrid" class="channel-grid">

        <div class="empty-state">
          Add your IPTV playlist to see channels here.
        </div>

      </div>

    </main>
  </div>

  <!-- PLAYLIST MODAL -->

  <div class="modal" id="playlistModal">

    <div class="modal-content">

      <h2>Add IPTV Playlist</h2>

      <label for="playlistUrl">
        Playlist URL (M3U / M3U8)
      </label>

      <input
        id="playlistUrl"
        class="input-field"
        type="url"
        placeholder="https://example.com/playlist.m3u"
        autocomplete="url">

      <p style="text-align:center;color:#9297ae;margin:15px 0;">
        OR SELECT M3U FILE
      </p>

      <input
        id="playlistFile"
        class="input-field"
        type="file"
        accept=".m3u,.m3u8,.txt">

      <div class="modal-actions">

        <button
          class="primary-btn"
          id="importPlaylistBtn"
          type="button">
          Import Playlist
        </button>

        <button
          class="secondary-btn"
          id="closeModalBtn"
          type="button">
          Cancel
        </button>

      </div>

    </div>
  </div>

  <!-- JAVASCRIPT FILES -->

  <script src="./playlist.js"></script>
  <script src="./player.js"></script>
  <script src="./app.js"></script>

  <!-- BUTTON ACTIONS -->

  <script>
    const fullscreenButton =
      document.getElementById("fullscreenBtn");

    fullscreenButton.addEventListener("click", function () {
      if (window.JemPlayer) {
        window.JemPlayer.toggleFullscreen();
      }
    });

    // Service Worker

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js")
          .catch(function (error) {
            console.log("Service Worker Error:", error);
          });
      });
    }
  </script>

</body>
</html>
